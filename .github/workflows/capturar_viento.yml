name: Capturar viento pronosticado SMN

on:
  workflow_dispatch: {}
  schedule:
    # Cada hora. El script solo captura ciclos COMPLETOS que todavía no tiene,
    # así que cada ciclo (00/06/12/18Z) se levanta apenas el SMN termina de
    # publicarlo, y si no hay nada nuevo termina en segundos sin commitear.
    - cron: '20 * * * *'

permissions:
  contents: write

concurrency:
  group: captura-viento
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests netCDF4 numpy

      - name: Capturar viento
        run: python capturar_viento.py

      # always(): si un ciclo falla pero otro se capturó bien, igual se guarda lo bueno
      - name: Guardar resultado en el repo
        if: always()
        run: |
          git config user.name 'smn-capture-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m 'Captura de viento pronosticado SMN'
            git pull --rebase
            git push
          fi

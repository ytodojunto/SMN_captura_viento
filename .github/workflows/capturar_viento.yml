name: Capturar viento pronosticado SMN

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 5,11,17,23 * * *'

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests netCDF4 numpy

      - name: Capturar viento
        run: python capturar_viento.py

      - name: Guardar resultado en el repo
        run: |
          git config user.name 'smn-capture-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || git commit -m 'Captura de viento pronosticado SMN'
          git push
